# Builds Jump's patched MiniStack image (see JUMP.md) for linux/amd64 and
# linux/arm64 and pushes it to this project's container registry.
#
# Runs on a tag named <upstream version>-jump.<n>, e.g. 1.5.42-jump.1, and
# pushes $CI_REGISTRY_IMAGE:<tag> and $CI_REGISTRY_IMAGE:jump-latest.

variables:
  # MiniStack's Dockerfile copies prebuilt MySQL plugins from its "full" image.
  # Upstream's release build uses the full image of the same release; this is
  # 1.5.42-full, pinned by digest so a rebuild gets the same plugins. Update it
  # when merging a new upstream release (JUMP.md).
  PLUGIN_DONOR_IMAGE: ghcr.io/ministackorg/ministack@sha256:d06118d640d3bbd6f4f51308bcaaa6bce5a21e6096279b067c2dd7c64f50599d

build-image:
  image: registry.gitlab.com/theworkingname/jump/infra/docker-images/ci-docker:v29.0.0
  services:
    - name: docker:29-dind
      alias: docker
      command: ['--tls=false']
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+-jump\.\d+$/
  script:
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    # QEMU emulators, so the amd64 runner can build the arm64 image too.
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm64
    - docker buildx create --name multiarch --driver docker-container --use
    - >
      docker buildx build
      --platform linux/amd64,linux/arm64
      --build-arg MINISTACK_VERSION="$CI_COMMIT_TAG"
      --build-arg PLUGIN_DONOR_IMAGE="$PLUGIN_DONOR_IMAGE"
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      --tag "$CI_REGISTRY_IMAGE:jump-latest"
      --push
      .
    - docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
